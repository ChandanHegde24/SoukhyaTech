<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>Home | Soukhya Tech</title>
    <script>
      (function () {
        var titles = {
          '/': 'Home',
          '/services': 'Services',
          '/solutions': 'Solutions',
          '/about': 'About',
          '/product': 'Product',
          '/contact': 'Contact'
        };
        var pathname = window.location.pathname.replace(/\/$/, '') || '/';
        if (titles[pathname]) {
          document.title = titles[pathname] + ' | Soukhya Tech';
        }
      })();
    </script>
    <meta name="description" content="Soukhya Tech delivers secure IoT and IIoT solutions, managed IT, cybersecurity, cloud, and digital operations services for connected industries." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://soukhyatech.com/" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://soukhyatech.com/" />
    <meta property="og:site_name" content="Soukhya Tech" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="IoT, IIoT &amp; Managed IT Solutions for Connected Industries | Soukhya Tech" />
    <meta property="og:description" content="Secure IoT, IIoT, managed IT, cybersecurity, cloud, and digital operations solutions for connected industries." />
    <meta property="og:image" content="https://soukhyatech.com/og-image.png" />
    <meta property="og:image:secure_url" content="https://soukhyatech.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Soukhya Tech Logo" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://soukhyatech.com/" />
    <meta name="twitter:title" content="IoT, IIoT &amp; Managed IT Solutions | Soukhya Tech" />
    <meta name="twitter:description" content="Secure technology solutions for connected industries." />
    <meta name="twitter:image" content="https://soukhyatech.com/og-image.png" />
    <meta name="twitter:image:alt" content="Soukhya Tech Logo" />

    <!-- WhatsApp & Legacy Social Share Preview Fallback -->
    <link rel="image_src" href="https://soukhyatech.com/og-image.png" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Performance: DNS Prefetch & Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" />

    <!-- Performance: Preload Above-the-Fold LCP Hero Poster -->
    <link rel="preload" as="image" href="/hero-poster.webp" type="image/webp" fetchpriority="high" />


    <!-- Theme Color & Design Tokens -->
    <meta name="theme-color" content="#081426" />
    <style>
      :root {
        --heading-color: #081426;
      }
    </style>

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Soukhya Tech",
      "url": "https://soukhyatech.com/",
      "logo": "https://soukhyatech.com/logo.png",
      "image": "https://soukhyatech.com/og-image.png",
      "description": "Soukhya Tech delivers secure IoT and IIoT solutions, managed IT, cybersecurity, cloud, and digital operations services for connected industries.",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-97317-47999",
        "contactType": "sales",
        "email": "sales@soukhyatech.com",
        "areaServed": "IN",
        "availableLanguage": ["English"]
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>

</html>
